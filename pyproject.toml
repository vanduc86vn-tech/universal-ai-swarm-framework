[project]
name = "hdd-ai-framework"
version = "3.0.0"
description = "Universal AI Swarm Governance & Google Antigravity Native Master Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-antigravity>=0.1.0",
    "aiomysql>=0.2.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
